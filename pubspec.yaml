name: banana_compass
description: "Banana Compass — a compass, level, altimeter, and weather app for every Android phone, by Nanatech Creative Studios."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  sensors_plus: ^7.1.1
  geolocator: ^14.1.2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  material_ui: ^1.11.0
  # Web only: DeviceOrientationEvent (compass heading + tilt) in the browser.
  # Mobile never imports this — see lib/services/heading_source.dart.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/icon/logo.png"
    background_color: "#121212"
    theme_color: "#121212"
  image_path: "assets/icon/logo.png"
  min_sdk_android: 24
